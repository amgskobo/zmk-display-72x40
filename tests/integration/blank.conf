# The panel's blank timeout at build time, which the runtime build without this
# file switches off (runtime/native_sim.conf): with it the panel darkens on its
# own part way through any test, so the two are built and run separately.
CONFIG_ZMK_DISPLAY_042INCH_BLANK_AFTER_MS=400
