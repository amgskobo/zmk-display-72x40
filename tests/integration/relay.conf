# The peripheral's power indicator rides the split relay, which a keyboard
# usually gets from another module; the fixture asks for it directly. The fork
# alone has the symbol, and assigning one upstream does not know is a build
# failure there, so this is added to the fork's builds only.
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
