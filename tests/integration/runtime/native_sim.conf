CONFIG_GPIO=n
CONFIG_ZMK_BLE=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_POINTING=y
CONFIG_PM_DEVICE=y
CONFIG_ASSERT=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ZMK_DISPLAY_LITE_RETRY_MS=10
CONFIG_ZMK_DISPLAY_LITE_TEST=y
# No timeout here, so the panel darkens only where a test sets one; blank.conf
# builds the default-length path on its own.
CONFIG_ZMK_DISPLAY_LITE_BLANK_AFTER_MS=0
